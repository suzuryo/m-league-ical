name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner route (manual hosted fallback)
        required: true
        type: choice
        default: arc
        options:
          - arc
          - github-hosted

permissions:
  contents: read

env:
  NODE_VERSION: "24.16.0"

jobs:
  lint:
    runs-on: ${{ (inputs.runner == 'github-hosted' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'arf-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm runtime dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libatomic1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm run lint

      - name: Test hosted dispatch arguments offline
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y python3
          python3 -m unittest discover -s tests -p '*_test.py'

  typecheck:
    runs-on: ${{ (inputs.runner == 'github-hosted' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'arf-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm runtime dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libatomic1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

  test:
    runs-on: ${{ (inputs.runner == 'github-hosted' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'arf-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm runtime dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libatomic1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm run test
